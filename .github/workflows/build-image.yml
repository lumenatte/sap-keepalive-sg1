name: 自动构建并发布专属镜像

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 显式赋予 GitHub 仓库打包发布写入权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录到 GitHub 容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: lumenatte
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动编译并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/lumenatte/sap-keepalive:latest # 严格推送到个人账户名下
