name: SAP CF APP保活

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Login to CF
        uses: rhysd/action-setup-cf-cli@v1
        with:
          version: '11.5.0'

      - name: Restart app
        run: |
          cf api ${{ secrets.CF_API }}
          cf login -u ${{ secrets.CF_USERNAME }} -p ${{ secrets.CF_PASSWORD }} -o ${{ secrets.CF_ORG }} -s ${{ secrets.CF_SPACE }} -a
          cf stop ${{ secrets.CF_APP }} || true
          cf start ${{ secrets.CF_APP }}
          cf app ${{ secrets.CF_APP }}
