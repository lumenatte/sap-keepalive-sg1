name: SAP CF APP保活

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Install CF CLI
        run: |
          wget -q https://packages.cloudfoundry.org/debian/cloudfoundry-cf-cli.asc -O /tmp/cloudfoundry-cf-cli.asc
          sudo apt-key add /tmp/cloudfoundry-cf-cli.asc
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cf-cli.list
          sudo apt-get update
          sudo apt-get install -y cf-cli

      - name: Login to CF
        run: |
          cf api ${{ secrets.CF_API }}
          cf login -u ${{ secrets.CF_USERNAME }} -p ${{ secrets.CF_PASSWORD }} -o ${{ secrets.CF_ORG }} -s ${{ secrets.CF_SPACE }} -a

      - name: Force restart app
        run: |
          cf stop ${{ secrets.CF_APP }} || true
          cf start ${{ secrets.CF_APP }}
          cf app ${{ secrets.CF_APP }}
