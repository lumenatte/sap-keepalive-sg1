name: SAP CF APP保活

on:
  schedule:
    - cron: '*/5 0 * * *'
    - cron: '*/10 0 * *'
    - cron: '*/15 0 * *'
    - cron: '*/20 0 * *'
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Login to CF
        uses: cloudfoundry/cli@v0
        with:
          api: ${{ secrets.CF_API }}
          username: ${{ secrets.CF_USERNAME }}
          password: ${{ secrets.CF_PASSWORD }}
          org: ${{ secrets.CF_ORG }}
          space: ${{ secrets.CF_SPACE }}

      - name: Force restart app
        run: |
          cf stop ${{ secrets.CF_APP }} || true
          cf start ${{ secrets.CF_APP }}
          cf app ${{ secrets.CF_APP }}
